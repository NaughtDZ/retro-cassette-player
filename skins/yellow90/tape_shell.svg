<?xml version="1.0" encoding="UTF-8"?>
<!-- 经典黄黑磁带外壳（不透明样例）：画布 520x356
     壳体整块遮住内部，只有观察窗挖穿（fill-rule=evenodd）能看到内部卷盘与磁带。
     装饰带/型号/标志画在壳体之后（顺序靠后 = 显示在最上层）。
     窗口区：x 104..416, y 222..318；白色贴纸区由程序绘制在 y 26..216。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="356">
  <defs>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4045"/>
      <stop offset="0.5" stop-color="#2c3135"/>
      <stop offset="1" stop-color="#22262a"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#dcae12"/>
    </linearGradient>
  </defs>

  <!-- 壳体主体 + 挖穿的观察窗 -->
  <path fill-rule="evenodd" fill="url(#gray)" stroke="#15181a" stroke-width="3"
        d="M 18 2.5 H 502 A 15.5 15.5 0 0 1 517.5 18 V 338 A 15.5 15.5 0 0 1 502 353.5
           H 18 A 15.5 15.5 0 0 1 2.5 338 V 18 A 15.5 15.5 0 0 1 18 2.5 Z
           M 113 231 H 407 A 9 9 0 0 1 416 240 V 300 A 9 9 0 0 1 407 309
           H 113 A 9 9 0 0 1 104 300 V 240 A 9 9 0 0 1 113 231 Z"/>

  <!-- 黄色装饰带：只占观察窗左右两侧，避免遮住窗口 -->
  <rect x="26" y="216" width="74" height="108" fill="url(#band)"/>
  <rect x="420" y="216" width="74" height="108" fill="url(#band)"/>

  <!-- 壳体磨砂颗粒质感 -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="130" r="1.1"/><circle cx="140" cy="90" r="1.1"/><circle cx="220" cy="60" r="1.1"/>
    <circle cx="330" cy="80" r="1.1"/><circle cx="430" cy="120" r="1.1"/><circle cx="470" cy="180" r="1.1"/>
    <circle cx="80" cy="330" r="1.1"/><circle cx="300" cy="340" r="1.1"/><circle cx="380" cy="330" r="1.1"/>
  </g>

  <!-- 型号与标识 -->
  <text x="63" y="292" font-family="Verdana,Arial,sans-serif" font-size="32" font-weight="bold"
        text-anchor="middle" fill="#2b2b2b">90</text>
  <text x="457" y="302" font-family="Verdana,Arial,sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2b2b2b">LH SM</text>
  <rect x="48" y="226" width="30" height="30" rx="3" fill="#d53a2c"/>
  <circle cx="63" cy="241" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="63" cy="241" r="3" fill="#ffffff"/>

  <!-- 窗口金属包边 -->
  <rect x="101" y="219" width="318" height="102" rx="11" fill="none"
        stroke="#6a7076" stroke-opacity="0.9" stroke-width="2"/>

  <!-- 底部压带区（梯形 + 两圆孔 + 两方孔） -->
  <path d="M 150 320 H 370 L 332 352 H 188 Z" fill="#24272a" stroke="#171a1c" stroke-width="2"/>
  <g fill="#101315">
    <circle cx="211" cy="341" r="6"/>
    <circle cx="309" cy="341" r="6"/>
    <rect x="249" y="331" width="10" height="10" rx="2"/>
    <rect x="261" y="331" width="10" height="10" rx="2"/>
  </g>

  <!-- 四角螺丝（金属圆凹槽 + 十字槽） -->
  <g fill="#8d949a" stroke="#4b5157" stroke-width="1.4">
    <circle cx="26" cy="20" r="8"/><circle cx="494" cy="20" r="8"/>
    <circle cx="26" cy="336" r="8"/><circle cx="494" cy="336" r="8"/>
  </g>
  <g stroke="#31363a" stroke-width="1.8" stroke-linecap="round">
    <path d="M 21.5 20 H 30.5"/><path d="M 26 15.5 V 24.5"/>
    <path d="M 489.5 20 H 498.5"/><path d="M 494 15.5 V 24.5"/>
    <path d="M 21.5 336 H 30.5"/><path d="M 26 331.5 V 340.5"/>
    <path d="M 489.5 336 H 498.5"/><path d="M 494 331.5 V 340.5"/>
  </g>
</svg>

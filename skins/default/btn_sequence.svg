      <stop offset="0" stop-color="#ffe9a4"/>
      <stop offset="0.42" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#c9991b"/>
    </radialGradient>
  </defs>
  <!-- 键槽（挖进面板的凹口：外圈深、内圈稍浅，做出嵌进去的深度） -->

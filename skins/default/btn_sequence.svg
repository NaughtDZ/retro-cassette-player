  <rect x="3.2" y="4.4" width="39.6" height="39.6" rx="11.0" fill="#0d2536" opacity="0.45"/>
  <!-- 键帽本体 -->
  <rect x="4.4" y="2.4" width="37.2" height="37.2" rx="9.6" fill="url(#f)" stroke="#8a6a12" stroke-width="1.2"/>
  <!-- 顶部高光带 + 更亮的细高光 -->
  <rect x="6.6" y="4.3" width="32.8" height="13.6" rx="6.6" fill="#ffffff" opacity="0.34"/>
  <rect x="7.8" y="5.4" width="30.4" height="6.0" rx="3.0" fill="#ffffff" opacity="0.30"/>
